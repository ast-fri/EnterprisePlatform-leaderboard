# Auto-generated from scenario.toml

services:
  green-agent:
    image: ghcr.io/ast-fri/enterpriseplatform-agentx:latest
    platform: linux/amd64
    container_name: green-agent
    command: ["--host", "0.0.0.0", "--port", "9009", "--card-url", "http://green-agent:9009"]
    environment:
      - PYTHONUNBUFFERED=1
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9009/.well-known/agent-card.json"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      EnterprisePurpleAgent:
        condition: service_healthy
    networks:
      - agent-network
    extra_hosts:
      - "host.docker.internal:host-gateway"  # This is the key line!
    ports:
      - "9010:9009"

  EnterprisePurpleAgent:
    image: ghcr.io/ast-fri/enterpriseplatform-purpleagent:latest
    platform: linux/amd64
    container_name: EnterprisePurpleAgent
    command: ["--host", "0.0.0.0", "--port", "9009", "--card-url", "http://EnterprisePurpleAgent:9009"]
    environment:
      - PYTHONUNBUFFERED=1
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9009/.well-known/agent-card.json"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - agent-network

  agentbeats-client:
    image: ghcr.io/agentbeats/agentbeats-client:v1.0.0
    platform: linux/amd64
    container_name: agentbeats-client
    volumes:
      - ./a2a-scenario.toml:/app/scenario.toml
      - ./output:/app/output
    command: ["scenario.toml", "output/results.json"]
    depends_on:
      green-agent:
        condition: service_healthy
      EnterprisePurpleAgent:
        condition: service_healthy
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge
